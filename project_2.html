<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Runner</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    border: 3px solid white;
    background: #222;
}
</style>
</head>

<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "start";

const keys = {};
const lanes = [200, 300, 400, 500, 600];

let obstacles = [];
let spawnTimer = 0;
let gameSpeed = 4;

let momentum = 70;
const maxMomentum = 100;
const momentumDrainRate = 0.08;
const momentumGain = 20;

const player = {
    x: lanes[2] - 20,
    y: 410,
    width: 40,
    height: 40,
    speed: 7
};

document.addEventListener("keydown", function(event) {
    keys[event.key] = true;

    if (gameState === "start" && event.key === " ") {
        resetGame();
        gameState = "playing";
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});

function resetGame() {
    obstacles = [];
    spawnTimer = 0;
    gameSpeed = 4;
    momentum = 70;
    player.x = lanes[2] - 20;
}

function updatePlayer() {

    if (keys["ArrowLeft"] || keys["a"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] || keys["d"]) {
        player.x += player.speed;
    }

    if (player.x < 160) {
        player.x = 160;
    }

    if (player.x + player.width > 640) {
        player.x = 640 - player.width;
    }
}

function spawnObstacle() {

    const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

    obstacles.push({
        x: randomLane - 20,
        y: -40,
        width: 40,
        height: 40
    });
}

function updateObstacles() {

    spawnTimer++;

    if (spawnTimer > 45) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {

        obstacles[i].y += gameSpeed;

        if (obstacles[i].y > canvas.height) {
            obstacles.splice(i, 1);
        }
    }
}

function updateMomentum() {

    momentum -= momentumDrainRate;

    if (momentum <= 0) {
        momentum = 0;
        gameState = "gameOver";
    }
}

function drawMomentumBar() {

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Momentum", 25, 30);

    ctx.fillStyle = "#555";
    ctx.fillRect(25, 45, 200, 20);

    ctx.fillStyle = "#4caf50";
    ctx.fillRect(25, 45, momentum * 2, 20);

    ctx.strokeStyle = "white";
    ctx.strokeRect(25, 45, 200, 20);
}

function drawObstacles() {

    ctx.fillStyle = "#ff4444";

    for (let obstacle of obstacles) {
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }
}

function checkCollisions() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        if (
            player.x < obstacle.x + obstacle.width &&
            player.x + player.width > obstacle.x &&
            player.y < obstacle.y + obstacle.height &&
            player.y + player.height > obstacle.y
        ) {

            momentum += momentumGain;

            if (momentum > maxMomentum) {
                momentum = maxMomentum;
            }

            obstacles.splice(i, 1);
        }
    }
}

function drawPlayer() {
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
}

function drawStartScreen() {

    ctx.fillStyle = "white";
    ctx.font = "42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Reverse Runner",
        canvas.width / 2,
        170
    );

    ctx.font = "22px Arial";

    ctx.fillText(
        "Press SPACE to Start",
        canvas.width / 2,
        240
    );

    ctx.fillText(
        "Move with A/D or Arrow Keys",
        canvas.width / 2,
        280
    );

    ctx.fillText(
        "Crash into falling blocks to keep momentum alive",
        canvas.width / 2,
        325
    );
}

function drawGameOverScreen() {

    ctx.fillStyle = "white";
    ctx.font = "42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Game Over",
        canvas.width / 2,
        200
    );

    ctx.font = "22px Arial";

    ctx.fillText(
        "You ran out of momentum",
        canvas.width / 2,
        250
    );

    ctx.fillText(
        "Press SPACE to Restart",
        canvas.width / 2,
        295
    );
}

function drawGame() {

    updatePlayer();
    updateObstacles();
    checkCollisions();
    updateMomentum();

    drawMomentumBar();
    drawPlayer();
    drawObstacles();
}

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (gameState === "start") {
        drawStartScreen();
    }

    if (gameState === "playing") {
        drawGame();
    }

    if (gameState === "gameOver") {
        drawGameOverScreen();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
