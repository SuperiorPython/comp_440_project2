<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Runner</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    border: 3px solid white;
    background: #222;
}
</style>
</head>

<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "start";

const keys = {};
const lanes = [200, 300, 400, 500, 600];

let obstacles = [];
let spawnTimer = 0;

let gameSpeed = 4;
const baseGameSpeed = 4;
const maxGameSpeed = 10;
const speedIncreaseInterval = 10;

let momentum = 70;
let displayedMomentum = 70;

const maxMomentum = 100;
const baseMomentumDrainRate = 0.08;
const movementMomentumDrainRate = 0.16;
const momentumGain = 20;

let survivalFrames = 0;
let survivalSeconds = 0;

const player = {
    x: lanes[2] - 20,
    y: 410,
    width: 40,
    height: 40,
    maxSpeed: 7,
    minSpeed: 2.5,
    currentSpeed: 7
};

document.addEventListener("keydown", function(event) {
    keys[event.key] = true;

    if ((gameState === "start" || gameState === "gameOver") && event.key === " ") {
        resetGame();
        gameState = "playing";
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});

function resetGame() {
    obstacles = [];
    spawnTimer = 0;
    gameSpeed = baseGameSpeed;
    momentum = 70;
    displayedMomentum = 70;
    survivalFrames = 0;
    survivalSeconds = 0;
    player.x = lanes[2] - 20;
    player.currentSpeed = player.maxSpeed;
}

function clamp(value, minimum, maximum) {

    if (value < minimum) {
        return minimum;
    }

    if (value > maximum) {
        return maximum;
    }

    return value;
}

function updatePlayer() {

    const momentumPercent = momentum / maxMomentum;

    player.currentSpeed =
        player.minSpeed +
        (player.maxSpeed - player.minSpeed) * momentumPercent;

    let isMoving = false;

    if (keys["ArrowLeft"] || keys["a"]) {
        player.x -= player.currentSpeed;
        isMoving = true;
    }

    if (keys["ArrowRight"] || keys["d"]) {
        player.x += player.currentSpeed;
        isMoving = true;
    }

    if (isMoving) {
        momentum -= movementMomentumDrainRate;
    }

    player.x = clamp(player.x, 160, 640 - player.width);
}

function spawnObstacle() {

    const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

    obstacles.push({
        x: randomLane - 20,
        y: -40,
        width: 40,
        height: 40
    });
}

function updateDifficulty() {
    const speedBoost = Math.floor(survivalSeconds / speedIncreaseInterval);
    gameSpeed = clamp(baseGameSpeed + speedBoost, baseGameSpeed, maxGameSpeed);
}

function updateObstacles() {

    spawnTimer++;

    if (spawnTimer > 45) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {

        obstacles[i].y += gameSpeed;

        if (obstacles[i].y > canvas.height) {
            obstacles.splice(i, 1);
        }
    }
}

function updateMomentum() {

    momentum -= baseMomentumDrainRate;
    momentum = clamp(momentum, 0, maxMomentum);

    displayedMomentum += (momentum - displayedMomentum) * 0.12;

    if (momentum <= 0) {
        momentum = 0;
        gameState = "gameOver";
    }
}

function updateTimer() {
    survivalFrames++;
    survivalSeconds = Math.floor(survivalFrames / 60);
}

function drawHUD() {

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Momentum", 25, 30);

    ctx.fillStyle = "#555";
    ctx.fillRect(25, 45, 200, 20);

    if (displayedMomentum > 60) {
        ctx.fillStyle = "#4caf50";
    } else if (displayedMomentum > 30) {
        ctx.fillStyle = "#ffc107";
    } else {
        ctx.fillStyle = "#ff4444";
    }

    ctx.fillRect(25, 45, displayedMomentum * 2, 20);

    ctx.strokeStyle = "white";
    ctx.strokeRect(25, 45, 200, 20);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.textAlign = "right";

    ctx.fillText("Time: " + survivalSeconds + "s", canvas.width - 25, 30);
    ctx.fillText("Fall Speed: " + gameSpeed.toFixed(1), canvas.width - 25, 60);
}

function drawObstacles() {

    ctx.fillStyle = "#ff4444";

    for (let obstacle of obstacles) {
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }
}

function checkCollisions() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        if (
            player.x < obstacle.x + obstacle.width &&
            player.x + player.width > obstacle.x &&
            player.y < obstacle.y + obstacle.height &&
            player.y + player.height > obstacle.y
        ) {

            momentum += momentumGain;
            momentum = clamp(momentum, 0, maxMomentum);

            obstacles.splice(i, 1);
        }
    }
}

function drawPlayer() {

    const momentumPercent = momentum / maxMomentum;

    ctx.fillStyle = "rgba(76, 175, 80, " + (0.4 + momentumPercent * 0.6) + ")";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
}

function drawStartScreen() {

    ctx.fillStyle = "white";
    ctx.font = "42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Reverse Runner",
        canvas.width / 2,
        150
    );

    ctx.font = "22px Arial";

    ctx.fillText(
        "Press SPACE to Start",
        canvas.width / 2,
        220
    );

    ctx.fillText(
        "Move with A/D or Arrow Keys",
        canvas.width / 2,
        260
    );

    ctx.fillText(
        "Crash into falling blocks to keep momentum alive",
        canvas.width / 2,
        305
    );

    ctx.fillText(
        "Low momentum makes movement slower",
        canvas.width / 2,
        345
    );
}

function drawGameOverScreen() {

    ctx.fillStyle = "white";
    ctx.font = "42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Game Over",
        canvas.width / 2,
        180
    );

    ctx.font = "22px Arial";

    ctx.fillText(
        "You ran out of momentum",
        canvas.width / 2,
        235
    );

    ctx.fillText(
        "Survival Time: " + survivalSeconds + " seconds",
        canvas.width / 2,
        275
    );

    ctx.fillText(
        "Press SPACE to Restart",
        canvas.width / 2,
        325
    );
}

function drawGame() {

    updatePlayer();
    updateTimer();
    updateDifficulty();
    updateObstacles();
    checkCollisions();
    updateMomentum();

    drawHUD();
    drawPlayer();
    drawObstacles();
}

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (gameState === "start") {
        drawStartScreen();
    }

    if (gameState === "playing") {
        drawGame();
    }

    if (gameState === "gameOver") {
        drawGameOverScreen();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
