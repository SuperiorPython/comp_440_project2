<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Runner</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    border: 3px solid white;
    background: #222;
}
</style>
</head>

<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "start";

const keys = {};

const lanes = [200, 300, 400, 500, 600];

let obstacles = [];
let spawnTimer = 0;
let gameSpeed = 4;

const player = {
    x: lanes[2] - 20,
    y: 410,
    width: 40,
    height: 40,
    speed: 7
};

document.addEventListener("keydown", function(event) {
    keys[event.key] = true;

    if (gameState === "start" && event.key === " ") {
        gameState = "playing";
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});

function updatePlayer() {

    if (keys["ArrowLeft"] || keys["a"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] || keys["d"]) {
        player.x += player.speed;
    }

    if (player.x < 160) {
        player.x = 160;
    }

    if (player.x + player.width > 640) {
        player.x = 640 - player.width;
    }
}

function spawnObstacle() {

    const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

    obstacles.push({
        x: randomLane - 20,
        y: -40,
        width: 40,
        height: 40
    });
}

function updateObstacles() {

    spawnTimer++;

    if (spawnTimer > 45) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {

        obstacles[i].y += gameSpeed;

        if (obstacles[i].y > canvas.height) {
            obstacles.splice(i, 1);
        }
    }
}

function drawObstacles() {

    ctx.fillStyle = "#ff4444";

    for (let obstacle of obstacles) {
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }
}

function checkCollisions() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        if (
            player.x < obstacle.x + obstacle.width &&
            player.x + player.width > obstacle.x &&
            player.y < obstacle.y + obstacle.height &&
            player.y + player.height > obstacle.y
        ) {

            console.log("Obstacle Hit");

            obstacles.splice(i, 1);
        }
    }
}

function drawLanes() {

    ctx.strokeStyle = "#444";
    ctx.lineWidth = 2;

    for (let lane of lanes) {
        ctx.beginPath();
        ctx.moveTo(lane, 0);
        ctx.lineTo(lane, canvas.height);
        ctx.stroke();
    }
}

function drawPlayer() {
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
}

function drawStartScreen() {

    ctx.fillStyle = "white";
    ctx.font = "42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Reverse Runner",
        canvas.width / 2,
        180
    );

    ctx.font = "22px Arial";

    ctx.fillText(
        "Press SPACE to Start",
        canvas.width / 2,
        250
    );

    ctx.fillText(
        "Move with A/D or Arrow Keys",
        canvas.width / 2,
        290
    );
}

function drawGame() {

    drawLanes();

    updatePlayer();
    updateObstacles();
    checkCollisions();

    drawPlayer();
    drawObstacles();
}

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (gameState === "start") {
        drawStartScreen();
    }

    if (gameState === "playing") {
        drawGame();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
